"# Clinical Model Configuration — UCI Heart Disease binary classification\nexperiment_name: clinical_baseline_xgboost\nrandom_seed: 42\n\ndata:\n  dataset: uci_heart\n  target_column: target  # 1 = CAD present (num > 0), 0 = absent\n  test_size: 0.2\n  val_size: 0.1\n  stratify: true\n\npreprocessing:\n  imputation_strategy: median\n  scaling: standard\n  encode_categoricals: true\n  preserve_missingness_flags: true\n\nmodel:\n  architecture: xgboost\n  n_estimators: 300\n  max_depth: 4\n  learning_rate: 0.05\n  subsample: 0.8\n  colsample_bytree: 0.8\n  min_child_weight: 3\n  gamma: 0.1\n  reg_alpha: 0.1\n  reg_lambda: 1.0\n  scale_pos_weight: auto  # Handle class imbalance\n  use_label_encoder: false\n  eval_metric: logloss\n\ncalibration:\n  method: isotonic\n  cv_folds: 5\n\nevaluation:\n  metrics: [auroc, auprc, f1, sensitivity, specificity, brier_score, calibration]\n  bootstrap_ci_samples: 1000\n  shap_max_display: 20\n\noutput:\n  save_dir: models\n  model_name: clinical_xgb_uci\n  log_dir: reports\n"