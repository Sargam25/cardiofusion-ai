"# ECG Model Configuration — PTB-XL 5-class superclass classification\nexperiment_name: ecg_baseline_cnn\nrandom_seed: 42\n\ndata:\n  dataset: ptb_xl\n  data_root: data/ptb-xl\n  sampling_rate: 100  # Use 100 Hz downsampled version\n  lead_count: 12\n  signal_length: 1000  # 10 seconds at 100 Hz\n  label_type: superdiagnostic  # NORM, MI, STTC, CD, HYP\n  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]\n  val_fold: 9\n  test_fold: 10\n  min_label_confidence: 0.0  # Include all records\n\npreprocessing:\n  normalize: true\n  normalization: per_lead_zscore\n  bandpass_filter: true\n  lowcut: 0.5\n  highcut: 40.0\n  filter_order: 4\n  remove_baseline: true\n\nmodel:\n  architecture: cnn_1d\n  in_channels: 12\n  num_classes: 5\n  hidden_channels: [32, 64, 128, 256]\n  kernel_sizes: [7, 5, 5, 3]\n  dropout: 0.3\n  use_batch_norm: true\n  use_residual: true\n\ntraining:\n  epochs: 50\n  batch_size: 64\n  learning_rate: 0.001\n  weight_decay: 0.0001\n  optimizer: adam\n  scheduler: cosine_annealing\n  early_stopping_patience: 10\n  class_weights: balanced\n  gradient_clip: 1.0\n\nevaluation:\n  metrics: [auroc, auprc, f1_macro, f1_per_class, sensitivity, specificity, brier_score]\n  bootstrap_ci_samples: 1000\n  calibration_bins: 10\n\noutput:\n  save_dir: models\n  model_name: ecg_cnn_ptbxl\n  log_dir: reports\n"