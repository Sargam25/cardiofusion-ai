"# Fusion Model Configuration — ECG + Clinical metadata (within PTB-XL)\n# NOTE: This model uses PTB-XL ECG waveforms + PTB-XL patient metadata\n# as the 'clinical' branch. Both modalities come from the same dataset\n# and are genuinely linked per patient. Laboratory features are NOT\n# available in PTB-XL and this branch is disabled (masked) in this config.\nexperiment_name: fusion_ecg_clinical_ptbxl\nrandom_seed: 42\n\ndata:\n  dataset: ptb_xl\n  data_root: data/ptb-xl\n  sampling_rate: 100\n  lead_count: 12\n  signal_length: 1000\n  label_type: superdiagnostic\n  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]\n  val_fold: 9\n  test_fold: 10\n  clinical_features:\n    - age\n    - sex\n    - height\n    - weight\n  lab_features: []  # Not available in PTB-XL — lab branch disabled\n\nmissing_modality:\n  enabled: true\n  dropout_prob_ecg: 0.1    # 10% chance ECG branch dropped during training\n  dropout_prob_clinical: 0.2  # 20% chance clinical dropped\n  dropout_prob_lab: 0.0    # Lab always missing (disabled)\n  mask_value: 0.0\n\nmodel:\n  ecg_encoder:\n    architecture: cnn_1d\n    in_channels: 12\n    hidden_channels: [32, 64, 128]\n    kernel_sizes: [7, 5, 3]\n    dropout: 0.3\n    embedding_dim: 128\n  clinical_encoder:\n    architecture: mlp\n    input_dim: 4  # age, sex, height, weight\n    hidden_dims: [32, 64]\n    dropout: 0.2\n    embedding_dim: 32\n  lab_encoder:\n    architecture: mlp\n    input_dim: 0  # disabled\n    enabled: false\n  fusion:\n    method: concatenation\n    post_fusion_dims: [128, 64]\n    dropout: 0.3\n  num_classes: 5\n\ntraining:\n  epochs: 50\n  batch_size: 64\n  learning_rate: 0.001\n  weight_decay: 0.0001\n  optimizer: adam\n  scheduler: cosine_annealing\n  early_stopping_patience: 10\n  class_weights: balanced\n\nevaluation:\n  metrics: [auroc, auprc, f1_macro, brier_score]\n  missing_modality_eval: true  # Evaluate under modality dropout\n  bootstrap_ci_samples: 1000\n\noutput:\n  save_dir: models\n  model_name: fusion_ecg_clinical_ptbxl\n"